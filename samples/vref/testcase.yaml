#
# NOTE: the Deep Power Down scenario is expected to FAIL on every target below,
# on two checks, and that failure is the point of the scenario. After a real
# power loss the driver's TURN_ON restores the devicetree configuration bits and
# the consumer's trim, but it opens with regulator_nxp_vref_disable() and never
# re-applies regulator-initial-mode -- so a consumer that still holds an enabled
# reference is left with a dead bandgap in STANDBY mode and gets no error saying
# so. The scenario then proves the block itself is fine by taking the output back
# with a disable/enable cycle. See README.md for the argument about whose job the
# re-enable is; every other scenario, Deep Sleep included, is expected to pass.
#
# Per-board wiring lives in boards/<board_target>.overlay -- the test-vref alias
# and regulator-initial-mode -- and is picked up automatically, so the system case
# stacks constraints.overlay with EXTRA_DTC_OVERLAY_FILE rather than replacing
# DTC_OVERLAY_FILE.
#
# There is no MCXA scenario: no MCXA SoC has an nxp,vref node. The MCXC parts have
# a vref, but it is compatible nxp,vrefv1 and a different driver.

common:
  tags:
    - pm
    - regulator
    - drivers
  platform_allow:
    - frdm_mcxn947/mcxn947/cpu0
    - frdm_mcxn947/mcxn947/cpu0/qspi
    - frdm_mcxn236
    - mcx_n9xx_evk/mcxn947/cpu0
    - mcx_n9xx_evk/mcxn947/cpu0/qspi
    - mcx_n5xx_evk/mcxn547/cpu0
  harness: console
  harness_config:
    type: multi_line
    ordered: false
    regex:
      - "PM-TEST: RESULT PASS"

tests:
  # Baseline: default prj.conf, no PM symbols at all.
  sample.pm.vref.baseline: {}

  sample.pm.vref.device:
    extra_args:
      - EXTRA_CONF_FILE=overlay-pm-device.conf

  sample.pm.vref.runtime:
    extra_args:
      - EXTRA_CONF_FILE=overlay-pm-runtime.conf

  sample.pm.vref.system:
    extra_args:
      - EXTRA_CONF_FILE=overlay-pm-system.conf
      - EXTRA_DTC_OVERLAY_FILE=constraints.overlay

  sample.pm.vref.sysmanaged:
    extra_args:
      - EXTRA_CONF_FILE=overlay-pm-sysmanaged.conf

  # Deep Power Down resets the VREF register block, so the core domain has to hand
  # the driver a TURN_OFF/TURN_ON pair around the transition. This is the only
  # scenario in which the driver's TURN_ON does real work, and the only one that
  # can answer what it does not restore.
  sample.pm.vref.dpd.mcxn:
    extra_args:
      - EXTRA_CONF_FILE=overlay-pm-sysmanaged.conf
      - EXTRA_DTC_OVERLAY_FILE=dpd-mcxn.overlay
