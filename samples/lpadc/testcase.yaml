#
# Per-board LPADC wiring lives in boards/<board_target>.overlay and is picked up
# automatically, so the system case stacks constraints.overlay with
# EXTRA_DTC_OVERLAY_FILE rather than replacing DTC_OVERLAY_FILE.

common:
  tags:
    - pm
    - adc
    - drivers
  platform_allow:
    # MCXN
    - frdm_mcxn947/mcxn947/cpu0
    - frdm_mcxn947/mcxn947/cpu0/qspi
    - frdm_mcxn236
    - mcx_n9xx_evk/mcxn947/cpu0
    - mcx_n9xx_evk/mcxn947/cpu0/qspi
    - mcx_n5xx_evk/mcxn547/cpu0
    # MCXA
    - frdm_mcxa153
    - frdm_mcxa156
    - frdm_mcxa266
    - frdm_mcxa344
    - frdm_mcxa346
    - frdm_mcxa366
    - frdm_mcxa577
  harness: console
  harness_config:
    type: multi_line
    ordered: false
    regex:
      - "PM-TEST: RESULT PASS"

tests:
  # Baseline: default prj.conf, no PM symbols at all.
  sample.pm.lpadc.baseline: {}

  sample.pm.lpadc.device:
    extra_args:
      - EXTRA_CONF_FILE=overlay-pm-device.conf

  sample.pm.lpadc.runtime:
    extra_args:
      - EXTRA_CONF_FILE=overlay-pm-runtime.conf

  sample.pm.lpadc.system:
    extra_args:
      - EXTRA_CONF_FILE=overlay-pm-system.conf
      - EXTRA_DTC_OVERLAY_FILE=constraints.overlay

  sample.pm.lpadc.sysmanaged:
    extra_args:
      - EXTRA_CONF_FILE=overlay-pm-sysmanaged.conf

  # Deep Power Down drops the LPADC register block, so the peripheral domain has
  # to hand the driver a TURN_OFF/TURN_ON pair around the transition. The state
  # is opt-in per family: only SRAMA survives DPD on MCXN, so the two families
  # need different devicetree overlays and therefore separate scenarios.
  sample.pm.lpadc.dpd.mcxn:
    extra_args:
      - EXTRA_CONF_FILE=overlay-pm-sysmanaged.conf
      - EXTRA_DTC_OVERLAY_FILE=dpd-mcxn.overlay
    platform_exclude:
      - frdm_mcxa153
      - frdm_mcxa156
      - frdm_mcxa266
      - frdm_mcxa344
      - frdm_mcxa346
      - frdm_mcxa366
      - frdm_mcxa577

  sample.pm.lpadc.dpd.mcxa:
    extra_args:
      - EXTRA_CONF_FILE=overlay-pm-sysmanaged.conf
      - EXTRA_DTC_OVERLAY_FILE=dpd-mcxa.overlay
    platform_exclude:
      - frdm_mcxn947/mcxn947/cpu0
      - frdm_mcxn947/mcxn947/cpu0/qspi
      - frdm_mcxn236
      - mcx_n9xx_evk/mcxn947/cpu0
      - mcx_n9xx_evk/mcxn947/cpu0/qspi
      - mcx_n5xx_evk/mcxn547/cpu0
