# Baseline LPADC device-PM test: no PM at all.
# Proves the sample configures the LPADC and completes a conversion. This is the
# control against which the PM phases are compared.

CONFIG_ADC=y
CONFIG_LOG=y
CONFIG_ADC_LOG_LEVEL_INF=y

# Log synchronously. The default deferred mode hands both LOG_* records and (via
# CONFIG_LOG_PRINTK) printk output to the log thread, which only runs when the
# main thread yields. main() deliberately ends in a k_busy_wait() spin so the
# core never parks in idle WFI (that powers down the DAP and the board stops
# being flashable), and a spin does not yield -- in deferred mode the whole run
# would be swallowed and the capture would come back empty even on a pass.
CONFIG_LOG_MODE_IMMEDIATE=y

# Vref is the LPADC reference; it must be enabled for conversions to be valid.
CONFIG_REGULATOR=y
