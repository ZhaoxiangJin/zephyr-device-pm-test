#
# See snippets/pm-device/pm-device.conf for why this is one line. The low-power
# timer and wakeup controller this layer needs to come back from the forced
# transition are implied by the layer symbol, so they follow the board's
# devicetree instead of being asserted here for all of them.

CONFIG_PM_TEST_LAYER_SYSMANAGED=y
