#
# One line, because the layer symbol brings in the PM Kconfig this layer needs;
# see lib/pm_test/Kconfig. Naming the layer here and configuring it there is what
# keeps the two from drifting apart. CONFIG_PM_TEST comes from the case's
# prj.conf, since the baseline layer has no snippet and still needs it.

CONFIG_PM_TEST_LAYER_DEVICE=y
