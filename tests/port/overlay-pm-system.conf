# Layer 3: system PM + per-device power-state constraints.
#
# With CONFIG_PM and CONFIG_PM_POLICY_DEVICE_CONSTRAINTS, a device whose node
# lists zephyr,disabling-power-states (see constraints.overlay) can block those
# states while it needs the hardware. The pin-mux driver never takes such a lock,
# and should not -- a pad configuration is not an operation in flight -- so this
# layer checks that nothing ends up holding one on its behalf.

CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_DEFAULT_ENABLE=y
CONFIG_PM_POLICY_DEVICE_CONSTRAINTS=y
