#
# One scenario per layer, and the layer is named once, as a snippet.
#
# The pin-mux nodes are enabled by every MCXN/MCXA SoC dtsi and need no wiring, so
# this case has no boards/ directory: src/port.c walks every enabled nxp,port-pinmux
# node with DT_FOREACH_STATUS_OKAY(). The system scenario still stacks
# constraints.overlay with EXTRA_DTC_OVERLAY_FILE rather than replacing
# DTC_OVERLAY_FILE, so a board overlay added later is still picked up.

common:
  tags:
    - pm
    - pinctrl
    - drivers
  harness: ztest
  platform_allow:
    # MCXN
    - frdm_mcxn947/mcxn947/cpu0
    - frdm_mcxn947/mcxn947/cpu0/qspi
    - frdm_mcxn236
    - mcx_n9xx_evk/mcxn947/cpu0
    - mcx_n9xx_evk/mcxn947/cpu0/qspi
    - mcx_n5xx_evk/mcxn547/cpu0
    # MCXA
    - frdm_mcxa153
    - frdm_mcxa156
    - frdm_mcxa266
    - frdm_mcxa344
    - frdm_mcxa346
    - frdm_mcxa366
    - frdm_mcxa577

tests:
  # The control. No snippet, so lib/pm_test's layer choice falls back to baseline.
  drivers.pm.port.baseline: {}

  drivers.pm.port.device:
    required_snippets:
      - pm-device

  drivers.pm.port.runtime:
    required_snippets:
      - pm-runtime

  # Which state the pin-mux does not survive is a property of this peripheral, so
  # the state list is the one thing a layer snippet cannot supply.
  drivers.pm.port.system:
    required_snippets:
      - pm-system
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=constraints.overlay

  drivers.pm.port.sysmanaged:
    required_snippets:
      - pm-sysmanaged

  # One scenario for both SoC families: the snippet applies the MCXN retained-SRAM
  # constraint from the board target itself.
  drivers.pm.port.dpd:
    required_snippets:
      - pm-dpd
