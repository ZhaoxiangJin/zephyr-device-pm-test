# Layer 4: system PM with the system-managed device sweep.
#
# CONFIG_PM_DEVICE_SYSTEM_MANAGED and CONFIG_PM_DEVICE_RUNTIME are mutually
# exclusive suspend paths, and they exercise different driver code:
#
#   - runtime PM   the consumer's own get/put drives SUSPEND/RESUME.
#   - system sweep pm_suspend_devices() walks every device in reverse init order
#                  on the way into a low-power state and resumes them on the way
#                  out.
#
# For a pin-mux both are meant to be no-ops. What matters here is the third
# actor this layer brings in: the SoC's core_domain. It is a device like any
# other, so the sweep suspends and resumes it, and that is what makes it hand
# every child that names it in power-domains a TURN_OFF/TURN_ON pair around a
# state listed in its onoff-power-states. Under runtime PM the domain is never
# swept and its children never see those actions.
#
# Stacked with dpd-mcxn.overlay or dpd-mcxa.overlay this reaches Deep Power Down,
# which is the only state that actually closes the pin-mux clock gates.

CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y

# Wakeup: LPTMR0 through the counter alarm API, the same arrangement the
# samples/boards/nxp/mcxn_a/s2ram sample uses.
CONFIG_WUC=y
CONFIG_COUNTER=y
CONFIG_COUNTER_MCUX_LPTMR_ALARM=y
