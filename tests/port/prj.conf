#
# Layer-independent configuration only. The PM symbols come from the layer, which
# comes from the pm-* snippet; see lib/pm_test/Kconfig and docs/pm-layers.md.
#
# There is no CONFIG_PINCTRL_NXP_PORT to set here: the SoC selects it, and the
# devices exist on every MCXN and MCXA board because everything that mentions a pin
# depends on them. src/port.c fails the build if it is somehow off.

CONFIG_ZTEST=y
CONFIG_PM_TEST=y

# Driver logging at info level, immediate: the run ends with interrupts locked so
# that the core cannot park in WFI, and a deferred log would never be flushed.
# include/pm_test/layer.h asserts this pairing.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PINCTRL_LOG_LEVEL_INF=y
