# Layer 1: manual device PM.
# The driver's pinctrl_mcux_pm_action() is exercised directly through
# pm_device_action_run(). No runtime PM, so every pin-mux inits ACTIVE.
#
# The only legal sequence from ACTIVE is SUSPEND -> TURN_OFF -> TURN_ON ->
# RESUME: pm_device_action_run() checks the current state against
# action_expected_state[] and returns -ENOTSUP for anything else.

CONFIG_PM_DEVICE=y
