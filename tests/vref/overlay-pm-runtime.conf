# Layer 2: runtime device PM (reference counted).
#
# CONFIG_PM_DEVICE_RUNTIME alone is NOT enough to get the interesting behaviour.
# pm_device_driver_init() (subsys/pm/device.c) only leaves a device SUSPENDED and
# marks runtime PM enabled for it when either
#   - CONFIG_PM_DEVICE_RUNTIME_DEFAULT_ENABLE=y, or
#   - the DT node has zephyr,pm-device-runtime-auto
# is present. Without one of them the device is resumed to ACTIVE, runtime PM stays
# *disabled* for it, and pm_device_runtime_get()/put() return 0 without doing
# anything (subsys/pm/device_runtime.c early-returns on !PM_DEVICE_FLAG_RUNTIME_ENABLED)
# -- i.e. the whole phase would silently pass while testing nothing.

CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_DEFAULT_ENABLE=y
