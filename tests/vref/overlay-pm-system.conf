# Layer 3: system PM + per-device power-state constraints.
# With CONFIG_PM and CONFIG_PM_POLICY_DEVICE_CONSTRAINTS a driver can block the
# power states its block does not survive while it has work in flight. The VREF
# driver takes no such lock -- an enabled reference is not an operation in flight
# -- so what this layer checks is that the mechanism is on, that the node
# declares the state (see constraints.overlay), and that nothing ends up holding
# a policy lock on the reference's behalf.

CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_DEFAULT_ENABLE=y
CONFIG_PM_POLICY_DEVICE_CONSTRAINTS=y
