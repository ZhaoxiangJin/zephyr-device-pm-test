#
# One scenario per layer, and the layer is named once, as a snippet. Per-board VREF
# wiring lives in boards/<board_target>.overlay and is picked up automatically.
#
# There is no MCXA target: no MCXA SoC has an nxp,vref node. The MCXC parts have a
# vref, but it is compatible nxp,vrefv1 and a different driver.
#
# The dpd scenario is expected to FAIL, on the two checks src/test_lowpower.c names,
# and that failure is the point of the scenario. Every other one is expected to
# pass except in the runtime and system layers on a tree without the power-domain
# TURN_ON fix; see tests/vref/README.md.

common:
  tags:
    - pm
    - regulator
    - drivers
  harness: ztest
  platform_allow:
    - frdm_mcxn947/mcxn947/cpu0
    - frdm_mcxn947/mcxn947/cpu0/qspi
    - frdm_mcxn236
    - mcx_n9xx_evk/mcxn947/cpu0
    - mcx_n9xx_evk/mcxn947/cpu0/qspi
    - mcx_n5xx_evk/mcxn547/cpu0

tests:
  # The control. No snippet, so lib/pm_test's layer choice falls back to baseline.
  drivers.pm.vref.baseline: {}

  drivers.pm.vref.device:
    required_snippets:
      - pm-device

  drivers.pm.vref.runtime:
    required_snippets:
      - pm-runtime

  # Which states the block does not survive is a property of this peripheral, so
  # the state list is the one thing a layer snippet cannot supply. Stacked with
  # EXTRA_DTC_OVERLAY_FILE so boards/<board_target>.overlay still applies.
  drivers.pm.vref.system:
    required_snippets:
      - pm-system
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=constraints.overlay

  drivers.pm.vref.sysmanaged:
    required_snippets:
      - pm-sysmanaged

  # The snippet applies the MCXN retained-SRAM constraint from the board target, so
  # this case needs no overlay of its own even though the driver's data -- and with
  # it the trim a consumer asked for -- has to survive in that window.
  drivers.pm.vref.dpd:
    required_snippets:
      - pm-dpd
