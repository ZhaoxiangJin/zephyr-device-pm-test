# Layer 4: system PM with the system-managed device sweep.
#
# CONFIG_PM_DEVICE_SYSTEM_MANAGED and CONFIG_PM_DEVICE_RUNTIME are mutually
# exclusive suspend paths, and they exercise different driver code:
#
#   - runtime PM   a consumer's get/put drives SUSPEND/RESUME. The regulator API
#                  takes no runtime PM reference of its own, so nothing but this
#                  test ever calls them on a vref.
#   - system sweep pm_suspend_devices() walks every device in reverse init order
#                  on the way into a low-power state and resumes them on the way
#                  out. Stacked with a DPD overlay this is also what drives the
#                  core power domain, and therefore the only path that reaches
#                  the driver's TURN_ON on a block that really lost power.
#
# This layer covers the second one: the reference boots ACTIVE and enabled, the
# test forces one transition, and the reference has to come back configured.

CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y

# Wakeup: LPTMR0 through the counter alarm API, the same arrangement the
# samples/boards/nxp/mcxn_a/s2ram sample uses.
CONFIG_WUC=y
CONFIG_COUNTER=y
CONFIG_COUNTER_MCUX_LPTMR_ALARM=y
