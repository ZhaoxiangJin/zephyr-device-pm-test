#
# One scenario per layer, and the layer is named once, as a snippet.
#
# The board devicetrees provide wwdt0. The MCXA577 overlay also instantiates wwdt1.
# The system layer uses the driver's SoC-level disabling-power-states.

common:
  tags:
    - pm
    - watchdog
    - drivers
  harness: ztest
  platform_allow:
    # MCXN
    - frdm_mcxn947/mcxn947/cpu0
    - frdm_mcxn947/mcxn947/cpu0/qspi
    - frdm_mcxn236
    - mcx_n9xx_evk/mcxn947/cpu0
    - mcx_n9xx_evk/mcxn947/cpu0/qspi
    - mcx_n5xx_evk/mcxn547/cpu0
    # MCXA
    - frdm_mcxa153
    - frdm_mcxa156
    - frdm_mcxa266
    - frdm_mcxa344
    - frdm_mcxa346
    - frdm_mcxa366
    - frdm_mcxa577

tests:
  # The control. No snippet, so lib/pm_test's layer choice falls back to baseline.
  drivers.pm.wwdt.baseline: {}

  drivers.pm.wwdt.device:
    required_snippets:
      - pm-device

  drivers.pm.wwdt.runtime:
    required_snippets:
      - pm-runtime

  drivers.pm.wwdt.system:
    required_snippets:
      - pm-system

  drivers.pm.wwdt.sysmanaged:
    required_snippets:
      - pm-sysmanaged

  # One scenario for both SoC families: the snippet applies the MCXN retained-SRAM
  # constraint from the board target itself.
  drivers.pm.wwdt.dpd:
    required_snippets:
      - pm-dpd
