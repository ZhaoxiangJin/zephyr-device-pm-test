# Layer 3: system PM + per-device power-state constraints.
# With CONFIG_PM and CONFIG_PM_POLICY_DEVICE_CONSTRAINTS the power states listed in
# the node's zephyr,disabling-power-states (see constraints.overlay) can be blocked
# by pm_policy_device_power_lock_get() while the comparator must keep comparing.
#
# NOTE: the LPCMP driver never takes such a lock itself -- unlike the LPADC driver,
# which locks around each conversion. So this layer exercises that the constraint
# metadata builds and does not disturb the device, and documents that any
# lock/unlock has to come from the application.

CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_DEFAULT_ENABLE=y
CONFIG_PM_POLICY_DEVICE_CONSTRAINTS=y
