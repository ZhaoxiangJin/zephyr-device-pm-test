#
# One scenario per layer, and the layer is named once, as a snippet. Per-board
# comparator wiring lives in boards/<board_target>.overlay and is picked up
# automatically.
#
# The optional GPIO loopback layer is not a scenario: it needs a jumper between two
# headers, so it is stacked onto one of these by hand. See README.md.

common:
  tags:
    - pm
    - comparator
    - drivers
  harness: ztest
  platform_allow:
    # MCXN
    - frdm_mcxn947/mcxn947/cpu0
    - frdm_mcxn947/mcxn947/cpu0/qspi
    - frdm_mcxn236
    - mcx_n9xx_evk/mcxn947/cpu0
    - mcx_n9xx_evk/mcxn947/cpu0/qspi
    - mcx_n5xx_evk/mcxn547/cpu0
    # MCXA
    - frdm_mcxa153
    - frdm_mcxa156
    - frdm_mcxa266
    - frdm_mcxa344
    - frdm_mcxa346
    - frdm_mcxa366
    - frdm_mcxa577

tests:
  # The control. No snippet, so lib/pm_test's layer choice falls back to baseline.
  drivers.pm.lpcmp.baseline: {}

  drivers.pm.lpcmp.device:
    required_snippets:
      - pm-device

  drivers.pm.lpcmp.runtime:
    required_snippets:
      - pm-runtime

  # Which states cut the comparator's analog bias is a property of this peripheral,
  # so the state list is the one thing a layer snippet cannot supply. Stacked with
  # EXTRA_DTC_OVERLAY_FILE so boards/<board_target>.overlay still applies.
  drivers.pm.lpcmp.system:
    required_snippets:
      - pm-system
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=constraints.overlay
