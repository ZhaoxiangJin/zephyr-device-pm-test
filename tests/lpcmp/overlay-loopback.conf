# Optional functional layer: stack this onto any layer's snippet.
#
#   west build -b $BOARD . -S pm-device -- -DEXTRA_CONF_FILE=overlay-loopback.conf
#
# Requires a jumper wire; the two pins are named in boards/<board_target>.overlay and
# in README.md. Without it the run fails immediately with an explicit wiring message.

CONFIG_PM_TEST_LPCMP_LOOPBACK=y
CONFIG_GPIO=y
