# Optional functional layer: stack this on top of one of the PM overlays.
#
#   -DEXTRA_CONF_FILE="overlay-pm-device.conf;overlay-loopback.conf"
#
# Requires a jumper wire on FRDM-MCXN947:  J2-11 (gpio1.12) -> J2-17 (CMP0_IN0).
# Without it the run fails fast with an explicit wiring message.

CONFIG_PM_TEST_LPCMP_LOOPBACK=y
CONFIG_GPIO=y
